<mat-toolbar color="primary" class="header">
    <!-- Back Button (Hidden on Dashboard) -->
    <button *ngIf="showBackButton" mat-icon-button (click)="goBack()" aria-label="Go back">
        <mat-icon>arrow_back_ios_new</mat-icon>
    </button>

    <!-- Hamburger Menu (Only on Dashboard) -->
    <button *ngIf="showHamburgerMenu" mat-icon-button (click)="onMenuClick()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
    </button>

    <!-- Logo -->
    <span class="logo">GTOP</span>

    <!-- Profile Picture with Mat-Menu -->
    <span class="spacer"></span>

    <button mat-icon-button class="profile-trigger" [matMenuTriggerFor]="profileMenu" *ngIf="user?.photoURL"
        aria-label="Open profile menu">
        <img [attr.src]="user.photoURL" alt="" class="profile-pic" />
    </button>


    <!-- Profile Menu -->
    <mat-menu #profileMenu="matMenu">
        <button mat-menu-item [routerLink]="'/profile'">
            <mat-icon>person</mat-icon>
            Profile
        </button>
        <button mat-menu-item (click)="signOut()">
            <mat-icon>logout</mat-icon>
            Sign Out
        </button>
    </mat-menu>
</mat-toolbar>
