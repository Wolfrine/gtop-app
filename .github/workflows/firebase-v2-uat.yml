name: GTOP v2 UAT

on:
  push:
    branches-ignore: [main]
    paths:
      - "gtop-v2/**"
      - "tools/gtop-mcp/**"
      - ".codex/config.toml"
      - ".github/workflows/firebase-v2-uat.yml"
  workflow_dispatch:

concurrency:
  group: gtop-v2-uat
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gtop-v2/package-lock.json
            tools/gtop-mcp/package-lock.json

      - name: Compile v2
        working-directory: gtop-v2
        run: |
          npm ci
          npm run build:uat
          package_version="$(node -p "require('./package.json').version")"
          printf '{"version":"%s-uat.%s","commit":"%s","branch":"%s","channel":"uat","builtAt":"%s"}' \
            "$package_version" "${GITHUB_SHA::8}" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%FT%TZ)" \
            > dist/gtop-v2/browser/version.json

      - name: Compile Firestore MCP
        working-directory: tools/gtop-mcp
        run: |
          npm ci
          npm run build

      - name: Deploy v2 to stable UAT hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          entryPoint: gtop-v2
          projectId: gtop-app
          channelId: live
          target: uat-gtop-v2

      - name: Publish UAT handoff
        shell: bash
        run: |
          {
            echo '## GTOP v2 UAT'
            echo ''
            echo '- URL: https://gtop-app-v2-uat.web.app'
            echo '- Backend: loopback Firebase emulators for `demo-gtop-assistant`'
            echo '- V1 production was not changed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
