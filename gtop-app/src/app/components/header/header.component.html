<mat-toolbar color="primary" class="header">
    <!-- Back Button (Hidden on Dashboard) -->
    <button *ngIf="showBackButton" mat-icon-button (click)="goBack()">
        <mat-icon>arrow_back_ios_new</mat-icon>
    </button>

    <!-- Hamburger Menu (Only on Dashboard) -->
    <button *ngIf="showHamburgerMenu" mat-icon-button (click)="onMenuClick()">
        <mat-icon>menu</mat-icon>
    </button>

    <!-- Logo -->
    <span class="logo">GTOP</span>

    <!-- Profile Picture -->
    <span class="spacer"></span>
    <img *ngIf="user?.photoURL" [attr.src]="user.photoURL" alt="Profile Picture" class="profile-pic" />
</mat-toolbar>
