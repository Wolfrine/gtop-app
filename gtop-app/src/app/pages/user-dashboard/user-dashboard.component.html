<div class="dashboard-container">

    <!-- Welcome Message -->
    <mat-card class="welcome-card">
        <h2>Welcome, {{ userName }}!</h2>
        <p>Standard: {{ userStandard }}</p>
        <p>Subjects: {{ userSubjects }}</p>
    </mat-card>

    <!-- Quick Start CTA -->
    <div class="quick-start">
        <div>
            <button mat-raised-button color="primary" (click)="openManualQuiz()"
                matTooltip="Customize your quiz: select subject, chapter & number of questions">
                Practice Builder
            </button>
        </div>
        <div>
            <button mat-raised-button color="primary" (click)="startQuickQuiz()"
                matTooltip="10 random questions from your subjects. Quick session to test skills!">
                Surprise Session
            </button>

        </div>
    </div>

    <!-- Current Stats Overview -->
    <div class="stats-overview">
        <mat-card class="stat-card">
            <h3>Total Quizzes Attempted</h3>
            <p>{{ totalQuizzes }}</p>
        </mat-card>

        <mat-card class="stat-card">
            <h3>Accuracy</h3>
            <p>{{ accuracyPercent }}%</p>
        </mat-card>

        <mat-card class="stat-card">
            <h3>Last Quiz Score</h3>
            <p>{{ lastQuizScore }}%</p>
        </mat-card>
    </div>

    <!-- Quick Access Buttons -->
    <div class="quick-access">

        <button mat-stroked-button color="accent" [routerLink]="['/reports']">View Reports</button>
    </div>

</div>
