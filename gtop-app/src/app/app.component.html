<!-- ✅ Header remains full-width & independent -->
<app-header (toggleSidebar)="sidenav.toggle()" *ngIf="!isLandingPage"></app-header>

<mat-drawer-container class="main-container">

    <!-- Side Navigation -->
    <mat-drawer #sidenav [mode]="sidenavMode" [opened]="isDesktop" class="sidenav" *ngIf="!isLandingAndProfile">
        <app-side-nav (itemClicked)="onNavItemClick()"></app-side-nav>
    </mat-drawer>

    <!-- Main Content -->
    <mat-drawer-content>
        <div class="content">
            <router-outlet></router-outlet>
        </div>
        <app-footer></app-footer>
    </mat-drawer-content>

</mat-drawer-container>
