name: Import GTOP design evidence

on:
  push:
    branches: [docs/design-upgrade-foundation-20261008]
    paths: [.github/workflows/import-design-evidence.yml]

permissions:
  contents: write
  actions: read

jobs:
  import:
    if: github.repository == 'Wolfrine/gtop-app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/design-upgrade-foundation-20261008
      - uses: actions/download-artifact@v4
        with:
          name: gtop-design-readiness-proof
          github-token: ${{ github.token }}
          run-id: 37758424604
          path: /tmp/gtop-design-import/initial
      - uses: actions/download-artifact@v4
        with:
          name: gtop-design-readiness-proof
          github-token: ${{ github.token }}
          run-id: 37759629039
          path: /tmp/gtop-design-import/followup
      - uses: actions/download-artifact@v4
        with:
          name: gtop-design-readiness-proof
          github-token: ${{ github.token }}
          run-id: 37760643776
          path: /tmp/gtop-design-import/final
      - name: Preserve exact originals and verify hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          root=Path('design-upgrade').resolve()
          source=Path('/tmp/gtop-design-import').resolve()
          manifest=json.loads((root/'evidence/readiness/import-manifest.json').read_text())
          for item in manifest['files']:
              src=(source/item['run']/item['sourcePath']).resolve()
              dst=(root/item['path']).resolve()
              if not src.is_relative_to(source) or not dst.is_relative_to(root):
                  raise ValueError('Path outside import scope')
              data=src.read_bytes()
              if len(data)!=item['bytes'] or hashlib.sha256(data).hexdigest()!=item['sha256']:
                  raise ValueError('Source bytes differ: '+item['sourcePath'])
              dst.parent.mkdir(parents=True,exist_ok=True)
              dst.write_bytes(data)
          PY
          python3 design-upgrade/verify_evidence.py
      - name: Commit evidence to the documentation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- design-upgrade/
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(not p or p.startswith('design-upgrade/') for p in paths)
          PY
          if git diff --cached --quiet; then
            echo 'Evidence already present with matching hashes.'
          else
            git commit -m 'Preserve original GTOP design readiness evidence'
            git push origin HEAD:docs/design-upgrade-foundation-20261008
          fi
