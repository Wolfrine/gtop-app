name: GT Papers approved growth design preview
on:
  push:
    branches:
      - design/gt-papers-earthy-2026-11-23
    paths:
      - 'question-papers/**'
      - '.github/workflows/gt-papers-growth-preview.yml'
permissions:
  contents: read
concurrency:
  group: gt-papers-growth-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    environment: firebase-development
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: question-papers/package-lock.json
      - name: Install existing GT Papers dependencies
        run: npm ci
        working-directory: question-papers
      - name: Build existing production-mode app for preview
        run: npm run build
        working-directory: question-papers
      - name: Install existing browser capture dependencies
        run: npm ci
        working-directory: gtop-app
      - name: Install Chromium for approved design comparison
        run: npx playwright install --with-deps chromium
        working-directory: gtop-app
      - name: Capture synthetic phone and desktop teacher-work states
        run: |
          npm --prefix question-papers start > "$RUNNER_TEMP/gt-papers-growth-serve.log" 2>&1 &
          papers_pid=$!
          trap 'kill "$papers_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4317/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/gt-papers-growth-serve.log"; exit 1; fi
          GTOP_PAPERS_RENDER_DIR="$RUNNER_TEMP/gtop-growth-design" node question-papers/scripts/growth-design-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: gt-papers-growth-visual-evidence
          path: '${{ runner.temp }}/gtop-growth-design'
          retention-days: 3
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - name: Deploy a separate expiring Firebase Hosting preview channel
        run: npx --yes firebase-tools@15 hosting:channel:deploy growth-redesign --config firebase.assistant.json --project gtop-app --expires 7d --non-interactive
      - name: Verify no production branch or default Hosting channel was targeted
        run: |
          test "$GITHUB_REF_NAME" = "design/gt-papers-earthy-2026-11-23"
          echo "Preview channel only. Production Hosting unchanged."
