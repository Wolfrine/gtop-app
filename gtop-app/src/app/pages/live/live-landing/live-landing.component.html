<div class="live-landing grid">
  <mat-card appCard>
    <h2>Create a Live Session</h2>

    <form [formGroup]="createForm" (ngSubmit)="createSession()">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Buffer (seconds)</mat-label>
        <input matInput type="number" formControlName="bufferSeconds" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Per Question (seconds)</mat-label>
        <input matInput type="number" formControlName="perQuestionSeconds" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Question IDs (comma-separated, optional)</mat-label>
        <input matInput type="text" formControlName="questionIdsCsv" placeholder="abc123, def456, ..." />
      </mat-form-field>

      <div class="actions">
        <button mat-stroked-button color="accent" type="button" (click)="generateQuestionIds()" [disabled]="isGenerating">
          <mat-icon>bolt</mat-icon>
          Auto-generate (10)
        </button>
        <button mat-stroked-button type="button" (click)="copyIds()" [disabled]="!createForm.value.questionIdsCsv">
          <mat-icon>content_copy</mat-icon>
          Copy IDs
        </button>
        <button mat-flat-button color="primary" type="submit" [disabled]="createForm.invalid">
          Create & Go to Host
        </button>
      </div>
    </form>

    <div *ngIf="generatedQuestions.length" class="preview">
      <h3>Generated Questions ({{ generatedQuestions.length }})</h3>
      <mat-list>
        <mat-list-item *ngFor="let q of generatedQuestions; let i = index">
          <div matListItemTitle>#{{ i + 1 }} · {{ q.title || (q.question | slice:0:60) }}</div>
          <div matListItemLine class="id">ID: {{ q.id }}</div>
        </mat-list-item>
      </mat-list>
    </div>
  </mat-card>

  <mat-card appCard>
    <h2>Join a Session</h2>
    <form [formGroup]="joinForm" (ngSubmit)="joinByCode()">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Join Code</mat-label>
        <input matInput type="text" formControlName="joinCode" />
      </mat-form-field>

      <button mat-flat-button color="accent" type="submit" [disabled]="joinForm.invalid">
        Join & Play
      </button>
    </form>
  </mat-card>

  <div class="error" *ngIf="errorMsg">{{ errorMsg }}</div>
</div>
