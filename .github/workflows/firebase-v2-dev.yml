name: GTOP v2 Dev

on:
  push:
    branches-ignore: [main]
    paths:
      - "gtop-v2/**"
      - ".github/workflows/firebase-v2-dev.yml"
  workflow_dispatch:

concurrency:
  group: gtop-v2-dev
  cancel-in-progress: true

jobs:
  validate-and-deploy-dev:
    runs-on: ubuntu-latest
    environment: firebase-development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gtop-v2/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install and validate v2
        working-directory: gtop-v2
        run: |
          npm ci
          npm run parity:check
          npm test
          npm run test:rules
          npm run test:database-rules
          npm run build:uat
          package_version="$(node -p "require('./package.json').version")"
          printf '{"version":"%s-dev.%s","commit":"%s","branch":"%s","channel":"dev","builtAt":"%s"}' \
            "$package_version" "${GITHUB_SHA::8}" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%FT%TZ)" \
            > dist/gtop-v2/browser/version.json

      - name: Browser and accessibility checks
        working-directory: gtop-v2
        run: |
          npx playwright install --with-deps chromium webkit
          npm run e2e

      - name: Authenticate Firebase site provisioning
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Ensure dev site exists
        working-directory: gtop-v2
        shell: bash
        run: |
          if ! npx --yes firebase-tools@15 hosting:sites:list --project gtop-app --json | grep -q 'dev-gtop-app'; then
            npx --yes firebase-tools@15 hosting:sites:create dev-gtop-app --project gtop-app
          fi

      - name: Authorize dev domains for Firebase Authentication
        shell: bash
        env:
          ACCESS_TOKEN: "${{ steps.google-auth.outputs.access_token }}"
        run: |
          config_url='https://identitytoolkit.googleapis.com/admin/v2/projects/gtop-app/config'
          current="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header 'Accept: application/json' \
            "${config_url}")"
          body="$(jq --compact-output \
            --arg web 'dev-gtop-app.web.app' \
            --arg firebase 'dev-gtop-app.firebaseapp.com' \
            '{authorizedDomains: ((.authorizedDomains // []) + [$web, $firebase] | unique)}' \
            <<<"${current}")"
          curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "${body}" \
            "${config_url}?updateMask=authorizedDomains" >/dev/null

      - name: Deploy v2 to dev hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          entryPoint: gtop-v2
          projectId: gtop-app
          channelId: live
          target: dev-gtop-app

      - name: Publish dev handoff
        shell: bash
        run: |
          {
            echo '## GTOP v2 Dev'
            echo ''
            echo '- URL: https://dev-gtop-app.web.app'
            echo '- Backend: live Firebase project `gtop-app`'
            echo '- Production hosting target was not touched.'
          } >> "$GITHUB_STEP_SUMMARY"
