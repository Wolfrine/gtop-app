<nav aria-label="Primary navigation">
    <a routerLink="/dashboard" class="rail-brand lumen-home-link">
        <img class="lumen-home-mark" src="assets/brand/growth-logo.webp" alt="" width="42" height="42" decoding="async">GTOP
    </a>
    <div class="destinations">
        @for (item of destinations; track item.route) {
            @if (!item.staff || admin) {
                <a class="destination" [class.compact-admin]="item.staff && section === 'Admin'"
                    [routerLink]="item.route" [attr.aria-label]="item.label"
                    [attr.aria-current]="section === item.label ? 'page' : null">
                    <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
                    <span class="wide-label">{{ item.label }}</span>
                    <span class="compact-label">{{ item.shortLabel || item.label }}</span>
                </a>
            }
        }
    </div>
    @if (admin && section === 'Admin') {
        <div class="admin-destinations" role="group" aria-labelledby="admin-navigation-title">
            <p id="admin-navigation-title">Admin workspace</p>
            @for (item of adminSections; track item.key) {
                <a class="destination" routerLink="/admin" [queryParams]="item.key ? { section: item.key } : null"
                    routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
                    <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>{{ item.title }}
                </a>
            }
        </div>
    }
</nav>
