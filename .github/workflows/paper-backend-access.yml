name: Inspect paper backend deployment access

on:
  push:
    branches: [main]
    paths: [".github/workflows/paper-backend-access.yml"]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: firebase-live-backend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only access inspection
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Report deployment identity and required access
        env:
          ACCESS_TOKEN: "${{ steps.auth.outputs.access_token }}"
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const credential=JSON.parse(readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));
          console.log('Deployment service account:',credential.client_email);
          const permissions=['datastore.indexes.create','datastore.indexes.get','datastore.indexes.list','datastore.indexes.update','cloudfunctions.functions.create','cloudfunctions.functions.update','cloudfunctions.functions.setIamPolicy','cloudfunctions.operations.get','run.services.setIamPolicy','storage.buckets.get','resourcemanager.projects.getIamPolicy','resourcemanager.projects.setIamPolicy'];
          const headers={Authorization:'Bearer '+process.env.ACCESS_TOKEN,'Content-Type':'application/json'};
          const response=await fetch('https://cloudresourcemanager.googleapis.com/v1/projects/gtop-app:testIamPermissions',{method:'POST',headers,body:JSON.stringify({permissions})});
          if(!response.ok)throw Error('Read-only project permission inspection failed with HTTP '+response.status);
          const granted=new Set((await response.json()).permissions??[]);
          console.log('Granted:',permissions.filter(p=>granted.has(p)).join(', '));
          console.log('Missing:',permissions.filter(p=>!granted.has(p)).join(', '));
          const delegatedEmail='78765581239-compute@developer.gserviceaccount.com';
          const delegated=await fetch('https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/'+encodeURIComponent(delegatedEmail)+':generateAccessToken',{method:'POST',headers,body:JSON.stringify({scope:['https://www.googleapis.com/auth/cloud-platform'],lifetime:'600s'})});
          console.log('Existing runtime-account delegation HTTP:',delegated.status);
          if(delegated.ok){
            const {accessToken}=await delegated.json();
            const checked=['datastore.indexes.create','datastore.indexes.update','resourcemanager.projects.setIamPolicy','eventarc.events.receiveEvent','run.routes.invoke'];
            const permissionCheck=await fetch('https://cloudresourcemanager.googleapis.com/v1/projects/gtop-app:testIamPermissions',{method:'POST',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({permissions:checked})});
            if(!permissionCheck.ok)throw Error('Delegated permission check HTTP '+permissionCheck.status);
            const allowed=new Set((await permissionCheck.json()).permissions??[]);
            console.log('Delegated granted:',checked.filter(p=>allowed.has(p)).join(', '));
            console.log('Delegated missing:',checked.filter(p=>!allowed.has(p)).join(', '));
          }
          const project=await fetch('https://cloudresourcemanager.googleapis.com/v1/projects/gtop-app',{headers});
          if(project.ok){
            const {projectNumber}=await project.json();
            const policy=await fetch('https://cloudresourcemanager.googleapis.com/v1/projects/gtop-app:getIamPolicy',{method:'POST',headers,body:'{}'});
            if(policy.ok){
              const bindings=(await policy.json()).bindings??[];
              for(const email of [credential.client_email,projectNumber+'-compute@developer.gserviceaccount.com','service-'+projectNumber+'@gcp-sa-pubsub.iam.gserviceaccount.com','service-'+projectNumber+'@gcp-sa-eventarc.iam.gserviceaccount.com']){
                console.log('Existing roles for '+email+':',bindings.filter(b=>b.members?.includes('serviceAccount:'+email)).map(b=>b.role).join(', '));
              }
            }
            for(const email of ['gtop-app@appspot.gserviceaccount.com',projectNumber+'-compute@developer.gserviceaccount.com']){
              const result=await fetch('https://iam.googleapis.com/v1/projects/gtop-app/serviceAccounts/'+encodeURIComponent(email)+':testIamPermissions',{method:'POST',headers,body:JSON.stringify({permissions:['iam.serviceAccounts.actAs']})});
              console.log('Act as '+email+':',result.ok?((await result.json()).permissions??[]).includes('iam.serviceAccounts.actAs'):('inspection HTTP '+result.status));
            }
          }
          console.log('Read-only inspection complete. No IAM bindings or production data changed.');
          NODE
