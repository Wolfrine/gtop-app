name: GTOP private assistant pilot
on:
  push:
    branches: [main]
    paths:
      - 'assistant-service/**'
      - 'question-papers/**'
      - 'tools/gtop-assistant/**'
      - 'firebase.assistant.json'
      - 'gtop-app/firestore.rules'
      - 'gtop-app/database.rules.json'
      - '.github/workflows/gtop-assistant-release.yml'
  workflow_dispatch:
concurrency:
  group: gtop-assistant-main
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      deploy_required: ${{ steps.scope.outputs.deploy_required }}
      backend_required: ${{ steps.scope.outputs.backend_required }}
      hosting_required: ${{ steps.scope.outputs.hosting_required }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Find the previous successful main release for deployment scope
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed run can leave both Hosting and the gateway several commits behind main.
          previous="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gtop-assistant-release.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' || true)"
          if [[ "$previous" =~ ^[a-f0-9]{40}$ ]] && git fetch --no-tags --depth=1 origin "$previous"; then
            echo "RELEASE_BEFORE=$previous" >> "$GITHUB_ENV"
          else
            echo "No verified previous release. Using full deployment scope."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            assistant-service/package-lock.json
            question-papers/package-lock.json
            tools/gtop-assistant/package-lock.json
            gtop-app/package-lock.json
      - run: npm ci
        working-directory: assistant-service
      - run: npm run check
        working-directory: assistant-service
      - name: Check assistant runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
        working-directory: assistant-service
      - run: npm ci && npm run check
        working-directory: tools/gtop-assistant
      - name: Classify cloud deployment scope without skipping required verification
        id: scope
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]] && node .github/suite-removal-scope.cjs "$PUSH_BASE" "$GITHUB_SHA"; then
            printf 'deploy_required=false\nbackend_required=false\nhosting_required=false\n' >> "$GITHUB_OUTPUT"
          else
            cd tools/gtop-assistant
            node --import ./node_modules/tsx/dist/loader.mjs src/release-scope.ts
          fi
      - run: npm ci && npm run build
        working-directory: question-papers
      - name: Check independent app runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
        working-directory: question-papers
      - name: Verify fixed hosting and gateway deployment scope
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const cfg=JSON.parse(fs.readFileSync('firebase.assistant.json'));
          assert.equal(cfg.hosting.site,'gtop-question-papers');assert.equal(cfg.functions.length,1);
          assert.equal(cfg.functions[0].codebase,'gtop-assistant');assert.equal(cfg.functions[0].source,'assistant-service');
          assert.equal(cfg.hosting.rewrites[0].function.functionId,'gtopAssistantGateway');
          fs.writeFileSync(cfg.hosting.public+'/version.json',JSON.stringify({application:'gtop-question-papers',commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString()}));
          NODE
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: verified-question-papers-${{ github.sha }}
          path: question-papers/dist/question-papers/browser
          retention-days: 1
          if-no-files-found: error
  backend:
    needs: verify
    if: ${{ needs.verify.outputs.backend_required == 'true' }}
    runs-on: ubuntu-latest
    environment: firebase-live-backend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
        working-directory: assistant-service
      - name: Load actual gateway with production-only dependencies before deployment
        run: node scripts/verify-runtime.mjs
        working-directory: assistant-service
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read aggregate Firestore usage with existing permissions
        continue-on-error: true
        run: node assistant-service/scripts/inspect-usage.mjs
      - name: Check live rule drift and deploy only worker identity restrictions
        run: node assistant-service/scripts/deploy-rules.mjs
      - name: Synchronize the private student directory using existing permissions
        run: node assistant-service/scripts/deploy-student-directory.mjs
      - name: Deploy assistant gateway using existing runtime permissions
        run: node assistant-service/scripts/deploy.mjs
      - name: Project original papers into their private catalogue once
        run: node assistant-service/scripts/backfill-paper-catalogue.mjs
      - name: Backfill curriculum browse options from the derived private catalogue
        run: node assistant-service/scripts/backfill-paper-facets.mjs
      - name: Read-only verification of real paper taxonomy and authorized search
        run: node assistant-service/scripts/verify-paper-catalogue.mjs
      - name: Inspect only assistant token-signing error diagnostics
        continue-on-error: true
        run: gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="gtopassistantgateway" AND textPayload:"Assistant gateway error:"' --project=gtop-app --freshness=30m --limit=5 --format='value(textPayload)'
  hosting:
    needs: [verify,backend]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.verify.outputs.hosting_required == 'true' && (needs.backend.result == 'success' || needs.backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: firebase-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild verified exact source commit without relying on artifact quota
        run: |
          npm ci
          npm run build
          node -e 'require("node:fs").writeFileSync("dist/question-papers/browser/version.json",JSON.stringify({application:"gtop-question-papers",commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString()}))'
        working-directory: question-papers
      - uses: google-github-actions/auth@v2
        id: hosting-auth
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Prepare only independent site and its Firebase Authentication domains
        env:
          ACCESS_TOKEN: '${{ steps.hosting-auth.outputs.access_token }}'
        run: node assistant-service/scripts/prepare-site.mjs
      - name: Verify existing gateway state without deploying it
        env:
          ACCESS_TOKEN: '${{ steps.hosting-auth.outputs.access_token }}'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://cloudfunctions.googleapis.com/v2/projects/gtop-app/locations/us-central1/functions/gtopAssistantGateway';
          let fn;
          for(let attempt=0;attempt<12;attempt++){
            const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACCESS_TOKEN},signal:AbortSignal.timeout(30000)});
            assert(r.ok,'Read-only gateway state check failed: HTTP '+r.status);fn=await r.json();
            if(fn.state==='ACTIVE')break;
            console.log('Existing gateway state: '+fn.state+'; waiting before Hosting release.');
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert.equal(fn.state,'ACTIVE');
          console.log(JSON.stringify({gatewayState:fn.state,gatewayRelease:fn.labels?.['gtop-release'],updatedAt:fn.updateTime,revision:fn.serviceConfig?.revision}));
          NODE
      - name: Deploy only independent Question Paper Hosting site
        run: npx --yes firebase-tools@15 deploy --project gtop-app --config firebase.assistant.json --only hosting:gtop-question-papers --non-interactive
      - name: Verify served commit and private gateway boundary
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin='https://gtop-question-papers.web.app';
          let served='';
          for(let attempt=1;attempt<=18;attempt++){
            const version=await fetch(origin+'/version.json?release='+encodeURIComponent(process.env.GITHUB_SHA)+'&attempt='+attempt,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(30000)});
            if(version.ok){const current=await version.json();served=current.commit||'';if(served===process.env.GITHUB_SHA)break;}
            else served='HTTP '+version.status;
            console.log('Hosting propagation: expected '+process.env.GITHUB_SHA+', observed '+served+' (attempt '+attempt+'/18)');
            if(attempt<18)await new Promise(resolve=>setTimeout(resolve,5000));
          }
          assert.equal(served,process.env.GITHUB_SHA,'Hosting did not serve deployed commit');
          assert.equal((await fetch(origin+'/api/session',{signal:AbortSignal.timeout(30000)})).status,401);
          const html=await fetch(origin,{signal:AbortSignal.timeout(30000)});assert(html.ok);assert((await html.text()).includes('<gtop-paper-app'));
          console.log('Independent Hosting commit and unauthenticated gateway denial verified. Visual acceptance is separately recorded.');
          NODE
