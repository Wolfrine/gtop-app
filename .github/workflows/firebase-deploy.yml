name: Deploy current GTOP application

on:
  push:
    branches: ["**"]
    paths:
      - "gtop-app/**"
      - ".github/workflows/firebase-deploy.yml"
      - ".github/workflows/firebase-v2-backend.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy the current GTOP application to dev or production."
        required: true
        type: choice
        default: rehearsal
        options: [rehearsal, production]
      confirm_production:
        description: "Required confirmation for production deployment."
        required: true
        type: boolean
        default: false

concurrency:
  group: current-gtop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend_required: ${{ steps.scope.outputs.backend_required }}
      assistant_only: ${{ steps.scope.outputs.assistant_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep frontend releases within their reviewed scope
        id: scope
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_BEFORE: ${{ github.event.before }}
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const {appendFileSync, existsSync} = require('node:fs');
          const {pathToFileURL} = require('node:url');
          (async()=>{
          const before = process.env.RELEASE_BEFORE || '';
          let required = true;
          let assistantOnly = false;
          if (process.env.RELEASE_EVENT === 'push' && /^[a-f0-9]{40}$/.test(before) && !/^0+$/.test(before)) {
            const files = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', before, process.env.GITHUB_SHA], {encoding: 'utf8'}).split('\0').filter(Boolean);
            // Only known frontend and documentation paths can skip backend deployment.
            // Unknown paths, missing history, and explicit dispatches retain the backend gate.
            const frontendOnly = /^(?:gtop-app\/(?:src\/|e2e\/)|docs\/|\.github\/workflows\/firebase-deploy\.yml$)/;
            required = files.some(file => !frontendOnly.test(file));
            if(existsSync('assistant-service/scripts/release-scope.mjs')) {
              const {assistantOnlyRelease}=await import(pathToFileURL(process.cwd()+'/assistant-service/scripts/release-scope.mjs'));
              const readAt=revision=>path=>execFileSync('git',['show',revision+':'+path],{encoding:'utf8'});
              assistantOnly=assistantOnlyRelease(files,readAt(before),readAt(process.env.GITHUB_SHA));
              if(assistantOnly)required=false;
            }
            console.log(`Reviewed release: ${files.length} changed paths; backend required: ${required}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `backend_required=${required}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `assistant_only=${assistantOnly}\n`);
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE

  reviewed-backend:
    needs: release-scope
    if: needs.release-scope.outputs.backend_required == 'true' && github.ref_name == 'main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.confirm_production))
    uses: ./.github/workflows/firebase-v2-backend.yml
    with:
      deploy_backend: true
      deployment_scope: paper-chat-backend
      allow_planned_rule_change: true
    secrets: inherit

  build-and-verify:
    needs: release-scope
    outputs:
      assistant_only: ${{ needs.release-scope.outputs.assistant_only }}
    if: >-
      !cancelled() && needs.release-scope.result == 'success' &&
      (github.event_name != 'push' || github.event.head_commit != null) &&
      (github.event_name != 'workflow_dispatch' || inputs.target != 'production' || inputs.confirm_production)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gtop-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install current application
        run: npm ci
        working-directory: gtop-app
      - name: Install and verify local paper service for browser checks
        run: npm ci && npm test
        working-directory: gtop-app/functions
      - name: Validate module logic and backend permissions
        run: npm run test:module && npm run test:rules && npm run test:database-rules
        working-directory: gtop-app
      - name: Build current production application
        run: |
          npm run build -- --configuration production
          node -e 'require("fs").writeFileSync("dist/gtop-app/browser/version.json", JSON.stringify({application:"gtop-app",commit:process.env.GITHUB_SHA,branch:process.env.GITHUB_REF_NAME,builtAt:new Date().toISOString()}))'
        working-directory: gtop-app
      - name: Verify current design, admin modules and restored sessions in browsers
        run: |
          npx playwright install --with-deps chromium webkit
          npm run e2e
        working-directory: gtop-app
      - name: Keep the verified application build for promotion
        if: needs.release-scope.outputs.assistant_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verified-application-${{ github.sha }}
          path: gtop-app/dist/gtop-app/browser
          retention-days: 1
          if-no-files-found: error
      - name: Keep review evidence
        if: always() && needs.release-scope.outputs.assistant_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: current-application-verification
          path: |
            gtop-app/test-results
            gtop-app/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  promote-hosting:
    needs: [reviewed-backend, build-and-verify]
    if: >-
      always() && !cancelled() && needs.build-and-verify.result == 'success' &&
      needs.build-and-verify.outputs.assistant_only != 'true' &&
      (needs.reviewed-backend.result == 'success' || needs.reviewed-backend.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.target != 'production' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'firebase-production' || 'firebase-development' }}
    permissions:
      contents: read
      checks: write
    outputs:
      promoted: ${{ steps.deploy.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gtop-app/package-lock.json
      - name: Authenticate read-only development readiness check
        if: needs.reviewed-backend.result == 'skipped'
        id: readiness-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Check shared paper register before development promotion
        if: needs.reviewed-backend.result == 'skipped'
        id: register-ready
        working-directory: gtop-app
        env:
          ACCESS_TOKEN: "${{ steps.readiness-auth.outputs.access_token }}"
        run: node scripts/check-paper-register-ready.mjs
      - name: Install live verification dependencies
        run: npm ci
        working-directory: gtop-app
      - name: Install the live verification browser
        run: npx playwright install --with-deps chromium
        working-directory: gtop-app
      - uses: actions/download-artifact@v4
        with:
          name: verified-application-${{ github.sha }}
          path: gtop-app/dist/gtop-app/browser
      - name: Deploy current GTOP application
        id: deploy
        if: needs.reviewed-backend.result == 'success' || steps.register-ready.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          entryPoint: gtop-app
          projectId: gtop-app
          channelId: live
          target: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'prod-gtop-app' || github.event_name == 'workflow_dispatch' && 'dev-gtop-app' || github.ref_name == 'main' && 'prod-gtop-app' || 'dev-gtop-app' }}
      - name: Verify actual hosted release and assets
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOY_ORIGIN: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'https://gtop-app.web.app' || github.event_name == 'workflow_dispatch' && 'https://dev-gtop-app.web.app' || github.ref_name == 'main' && 'https://gtop-app.web.app' || 'https://dev-gtop-app.web.app' }}
        run: node scripts/verify-deployment.mjs "$DEPLOY_ORIGIN" "$GITHUB_SHA"
        working-directory: gtop-app
      - name: Keep actual hosted-page verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-current-application
          path: gtop-app/test-results/deployed-site
          retention-days: 7
          if-no-files-found: ignore
  verify-shared-backend:
    needs: promote-hosting
    if: needs.promote-hosting.outputs.promoted == 'true' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gtop-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
        working-directory: gtop-app
      - name: Authenticate read-only backend inspection
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Check active shared rules without changing them
        working-directory: gtop-app
        env:
          ACCESS_TOKEN: "${{ steps.auth.outputs.access_token }}"
        run: node scripts/verify-live-paper-rules.mjs
      - name: Keep actual backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-backend-verification
          path: gtop-app/test-results/active-backend
          retention-days: 7
          if-no-files-found: ignore
