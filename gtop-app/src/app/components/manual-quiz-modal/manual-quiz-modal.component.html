<h2 mat-dialog-title>Custom Quiz</h2>

<div mat-dialog-content class="modal-content">
    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Board</mat-label>
        <mat-select [(ngModel)]="board" [disabled]="!isAdmin" (selectionChange)="onBoardChange()">
            <mat-option *ngFor="let b of boards" [value]="b">{{ b }}</mat-option>
        </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Standard</mat-label>
        <mat-select [(ngModel)]="standard" [disabled]="!isAdmin || !board" (selectionChange)="onStandardChange()">
            <mat-option *ngFor="let std of standards" [value]="std">{{ std }}</mat-option>
        </mat-select>
    </mat-form-field>


    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Subjects</mat-label>
        <mat-select [(ngModel)]="selectedSubjects" multiple (selectionChange)="onSubjectsChange()">
            <mat-option *ngFor="let subject of subjects" [value]="subject">{{ subject }}</mat-option>
        </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Chapters</mat-label>
        <mat-select [(ngModel)]="selectedChapters" multiple>
            <mat-option *ngFor="let chapter of chapters" [value]="chapter">{{ chapter }}</mat-option>
        </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Number of Questions</mat-label>
        <input matInput type="number" [(ngModel)]="questionCount" />
    </mat-form-field>

    <div class="difficulty-section">
        <p id="quiz-difficulty-label">Difficulty</p>
        <mat-radio-group [(ngModel)]="difficultyLevel" aria-labelledby="quiz-difficulty-label">
            <mat-radio-button value="easy">Easy</mat-radio-button>
            <mat-radio-button value="medium">Medium</mat-radio-button>
            <mat-radio-button value="hard">Hard</mat-radio-button>
            <mat-radio-button value="adaptive">Adaptive</mat-radio-button>
        </mat-radio-group>
    </div>
</div>

<div mat-dialog-actions align="end">
    <button mat-stroked-button color="primary" (click)="closeDialog()">Cancel</button>
    <button mat-raised-button color="primary" (click)="startQuiz()">Start Quiz</button>
</div>
