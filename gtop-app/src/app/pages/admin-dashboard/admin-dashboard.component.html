<div class="admin-dashboard-container">
    <h1>Admin Console</h1>
    <!-- Quick Actions -->
    <div class="quick-actions">
        <button mat-flat-button color="primary" class="fab-button" routerLink="/admin/add-mcq">
            <mat-icon>add</mat-icon> Add MCQs
        </button>
        <button mat-stroked-button color="primary" class="fab-button" routerLink="/quiz">
            <mat-icon>quiz</mat-icon> Quick Quiz
        </button>
        <a mat-stroked-button color="primary" class="fab-button" [routerLink]="['/live']" matTooltip="Host or join a live session">
            <mat-icon>bolt</mat-icon> Live Quizzes
        </a>
    </div>

    <!-- Overview Cards -->
    <div class="quick-actions" aria-label="Question bank tools">
        <a mat-stroked-button color="primary" class="fab-button" routerLink="/syllabus-preview"><mat-icon>menu_book</mat-icon> Syllabus review</a>
        <a mat-flat-button color="primary" class="fab-button" routerLink="/admin/question-library"><mat-icon>library_books</mat-icon> Question bank</a>
        <a mat-flat-button color="primary" class="fab-button" routerLink="/admin/question-papers"><mat-icon>description</mat-icon> Question papers</a>
        <a mat-stroked-button color="primary" class="fab-button" routerLink="/admin/question-review"><mat-icon>fact_check</mat-icon> Review new questions</a>
    </div>
    <div class="overview-container">
        <mat-card appCard class="overview-card">
            <mat-card-title>Active Users</mat-card-title>
            <mat-card-content>{{ activeUsers }}</mat-card-content>
        </mat-card>
        <mat-card appCard class="overview-card">
            <mat-card-title>Total MCQs</mat-card-title>
            <mat-card-content>{{ totalMCQs }}</mat-card-content>
        </mat-card>
        <mat-card appCard class="overview-card">
            <mat-card-title>Total Users</mat-card-title>
            <mat-card-content>{{ totalUsers }}</mat-card-content>
        </mat-card>
    </div>

    <!-- Recent Activity Section -->
    <mat-card appCard class="recent-activity">
        <h3>Recent Activity</h3>
        <mat-list>
            <mat-list-item *ngFor="let activity of recentActivities">
                <mat-icon>history</mat-icon>
                <span>{{ activity }}</span>
            </mat-list-item>
        </mat-list>
    </mat-card>


</div>
