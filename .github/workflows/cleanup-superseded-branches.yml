name: Remove superseded branches
on:
  push:
    branches: [integrate/question-paper-main]
    paths: [.github/workflows/cleanup-superseded-branches.yml]
jobs:
  remove-superseded-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove only the obsolete branch heads approved by the owner
        uses: actions/github-script@v7
        with:
          script: |
            // Owner requested removal on 23 September 2026. Preserve main and current review work.
            const obsolete = [
            { ref: "agent/fix-mcp-version-precondition", sha: "277dcc9ed5fddcdfad3f64675009682b1e287b3d" },
            { ref: "agent/fix-mcp-version-token", sha: "3d543fe64c3efccdfc09797ad21ce7d99f0d5fbf" },
            { ref: "agent-access-check-20260920-1201", sha: "9c915c615895cca7e6c50229f64e17ff1a78b2e9" },
            { ref: "codex/gtop-hosted-mcp", sha: "459a7c994a9e6ccb05182648871ad90581b0ee1b" },
            { ref: "codex/gtop-mcp-access", sha: "f6ddfbde44a1224c2c8ff62bbad9cf9324c3ae0b" },
            { ref: "codex/plant-reproduction-lab", sha: "4ae87309f339b3682b6e2ed746efc52ce30fca3c" },
            { ref: "codex/v1-learning-lab", sha: "cf772aa623597b73970bf3e4f5e6cb3f3456b26b" },
            { ref: "codex/v1-ui-review", sha: "063c3d16a0bb8da64b5ac369e481100431bbf457" },
            { ref: "dev", sha: "ca82cbf518430ac71aeddbbd782522872fb762e0" },
            { ref: "feature/gtop-v2", sha: "87b269920691af8a6ff176026d6b7fb71e7701d0" },
            { ref: "feature/question-paper-generator", sha: "c6435b5d3ad98c055e30fe2257574f1a5720874a" },
            { ref: "fix/question-paper-readiness", sha: "2ae9c1bae6c855629c4ad3ca77212d0bd7a7315c" },
            ];
            const { owner, repo } = context.repo;
            for (const item of obsolete) {
              if (['main', 'integrate/question-paper-main'].includes(item.ref)) throw new Error('Canonical or active branch cannot be deleted');
              let current;
              try { current = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + item.ref }); }
              catch (error) { if (error.status === 404) { core.info(item.ref + ' already absent'); continue; } throw error; }
              if (current.data.object.sha !== item.sha) {
                core.setFailed(item.ref + ' has changed since inspection; preserved for review');
                continue;
              }
              await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + item.ref });
              core.info('Deleted superseded branch ' + item.ref);
            }
