name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - '**'
    paths:
      - 'gtop-app/**'
      - '.github/workflows/firebase-deploy.yml'

# Ensure only the latest run per branch is active; cancel older in-progress runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Skip runs created by branch creation (push with no head_commit)
    if: github.event_name != 'push' || github.event.head_commit != null
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
        working-directory: gtop-app

      - run: npm run build -- --configuration production
        working-directory: gtop-app

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          entryPoint: gtop-app
          projectId: gtop-app
          channelId: live
          target: ${{ github.ref_name == 'main' && 'prod-gtop-app' || 'dev-gtop-app' }}
