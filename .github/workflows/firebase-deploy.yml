name: Deploy current GTOP application

on:
  push:
    branches: ["**"]
    paths:
      - "gtop-app/**"
      - ".github/workflows/firebase-deploy.yml"
      - ".github/workflows/firebase-v2-backend.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy the current GTOP application to dev or production."
        required: true
        type: choice
        default: rehearsal
        options: [rehearsal, production]
      confirm_production:
        description: "Required confirmation for production deployment."
        required: true
        type: boolean
        default: false

concurrency:
  group: current-gtop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend_required: ${{ steps.scope.outputs.backend_required }}
      backend_scope: ${{ steps.scope.outputs.backend_scope }}
      assistant_only: ${{ steps.scope.outputs.assistant_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep frontend releases within their reviewed scope
        id: scope
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$RELEASE_EVENT" == push ]] && node .github/suite-removal-scope.cjs "$RELEASE_BEFORE" "$GITHUB_SHA"; then
            printf 'backend_required=false\nassistant_only=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const {appendFileSync, existsSync} = require('node:fs');
          const {pathToFileURL} = require('node:url');
          const {isDeepStrictEqual} = require('node:util');
          (async()=>{
          const before = process.env.RELEASE_BEFORE || '';
          let required = true;
          let assistantOnly = false;
          let backendScope = 'paper-chat-backend';
          if (process.env.RELEASE_EVENT === 'push' && /^[a-f0-9]{40}$/.test(before) && !/^0+$/.test(before)) {
            const files = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', before, process.env.GITHUB_SHA], {encoding: 'utf8'}).split('\0').filter(Boolean);
            // Only known frontend and documentation paths can skip backend deployment.
            // Unknown paths, missing history, and explicit dispatches retain the backend gate.
            const frontendOnly = /^(?:gtop-app\/(?:src\/|scripts\/verify-deployment\.mjs$|AGENTS\.md$|firebase\.local\.json$|storage\.local\.rules$)|(?:docs|raw|wiki|codex|question-papers|assistant-service|gtop-v2|tools\/gtop-assistant)\/|AGENTS\.md$|\.github\/workflows\/(?:firebase-deploy|firebase-v2-uat|firebase-v2-backend|gtop-assistant-release)\.yml$)/;
            required = files.some(file => !frontendOnly.test(file));
            const legacyRuntime = /^gtop-app\/(?:functions\/(?:index|paper-engine|legacy-environment)\.mjs|scripts\/deploy-paper-functions\.mjs)$/;
            if (required && files.every(file => frontendOnly.test(file) || legacyRuntime.test(file))) backendScope = 'paper-runtime-only';
            // PDF decoding for the student upload is a browser-only dependency.
            const packagePaths = ['gtop-app/package.json','gtop-app/package-lock.json'];
            const buildPath = 'gtop-app/angular.json';
            const serviceWorkerPath = 'gtop-app/ngsw-config.json';
            if (required && packagePaths.every(path => files.includes(path)) &&
                files.every(path => frontendOnly.test(path) || packagePaths.includes(path) || path === buildPath)) {
              const read = (sha,path) => JSON.parse(execFileSync('git',['show',sha+':'+path],{encoding:'utf8'}));
              const manifest = read(before,packagePaths[0]);
              const previousLock = read(before,packagePaths[1]);
              const manifestNow = read(process.env.GITHUB_SHA,packagePaths[0]);
              const lock = read(process.env.GITHUB_SHA,packagePaths[1]);
              const browserPdf = manifestNow.dependencies?.['pdfjs-dist'];
              const expectedBuild = read(before,buildPath);
              expectedBuild.projects['gtop-app'].architect.build.options.assets.push(
                {glob:'pdf*.min.mjs',ignore:['pdf.sandbox.min.mjs'],input:'node_modules/pdfjs-dist/legacy/build',output:'answer-sheet-pdf'},
                {glob:'*.bcmap',input:'node_modules/pdfjs-dist/cmaps',output:'answer-sheet-pdf/cmaps'},
                {glob:'*',input:'node_modules/pdfjs-dist/standard_fonts',output:'answer-sheet-pdf/standard_fonts'}
              );
              const oldPackagesUnchanged = Object.entries(previousLock.packages).every(([path,value]) =>
                path === '' || isDeepStrictEqual(value,lock.packages[path]));
              const newPackages = Object.keys(lock.packages).filter(path => !(path in previousLock.packages));
              const browserPdfPaths = /^node_modules\/(?:pdfjs-dist|@napi-rs\/canvas(?:-|$))/;
              if (browserPdf === '5.4.624' && !manifest.dependencies?.['pdfjs-dist'] &&
                  isDeepStrictEqual(manifestNow,{...manifest,dependencies:{...manifest.dependencies,'pdfjs-dist':browserPdf}}) &&
                  isDeepStrictEqual(lock.packages[''],{...previousLock.packages[''],
                    dependencies:{...previousLock.packages[''].dependencies,'pdfjs-dist':browserPdf}}) &&
                  oldPackagesUnchanged && newPackages.every(path => browserPdfPaths.test(path)) &&
                  isDeepStrictEqual(expectedBuild,read(process.env.GITHUB_SHA,buildPath))) required = false;
            }
            if (required && [...packagePaths,buildPath,serviceWorkerPath].every(path => files.includes(path)) &&
                files.every(path => frontendOnly.test(path) || packagePaths.includes(path) || path === buildPath || path === serviceWorkerPath)) {
              const read = (sha,path) => JSON.parse(execFileSync('git',['show',sha+':'+path],{encoding:'utf8'}));
              const after=process.env.GITHUB_SHA;
              const manifest=read(before,packagePaths[0]), next=read(after,packagePaths[0]);
              const lock=read(before,packagePaths[1]), newLock=read(after,packagePaths[1]);
              const writer=next.dependencies?.['pdf-lib'];
              const dependencies={...manifest.dependencies,'pdf-lib':writer};
              const allow=new Set(['node_modules/pdf-lib','node_modules/@pdf-lib/standard-fonts','node_modules/@pdf-lib/upng',
                'node_modules/pako','node_modules/pdf-lib/node_modules/tslib']);
              const pureLock=Object.entries(lock.packages).every(([path,value])=>path===''||isDeepStrictEqual(value,newLock.packages[path])) &&
                Object.keys(newLock.packages).every(path=>path in lock.packages||allow.has(path));
              const angular=read(before,buildPath), assets=angular.projects['gtop-app'].architect.build.options.assets;
              const worker=assets.findIndex(asset=>asset?.input==='node_modules/pdfjs-dist/legacy/build');
              if(worker>=0)assets.splice(worker+1,0,{glob:'pdf-lib.esm.min.js',input:'node_modules/pdf-lib/dist',output:'answer-sheet-pdf'});
              const sw=read(before,serviceWorkerPath);
              sw.assetGroups.splice(1,0,{name:'scan-pdf-writer',installMode:'lazy',updateMode:'lazy',
                resources:{files:['/answer-sheet-pdf/pdf-lib.esm.min.js']}});
              if(writer==='1.17.1'&&!manifest.dependencies['pdf-lib']&&pureLock&&worker>=0&&
                  isDeepStrictEqual(next,{...manifest,dependencies})&&
                  isDeepStrictEqual(newLock.packages[''],{...lock.packages[''],dependencies})&&
                  isDeepStrictEqual(angular,read(after,buildPath))&&isDeepStrictEqual(sw,read(after,serviceWorkerPath))) required=false;
            }
            if(existsSync('assistant-service/scripts/release-scope.mjs')) {
              const {assistantOnlyRelease}=await import(pathToFileURL(process.cwd()+'/assistant-service/scripts/release-scope.mjs'));
              const readAt=revision=>path=>execFileSync('git',['show',revision+':'+path],{encoding:'utf8'});
              assistantOnly=assistantOnlyRelease(files,readAt(before),readAt(process.env.GITHUB_SHA));
              if(assistantOnly)required=false;
            }
            if(!required && files.length && files.every(file=>file==='.github/workflows/firebase-v2-backend.yml' ||
              file==='.github/workflows/firebase-deploy.yml')) assistantOnly=true;
            const notificationPaths=new Set(['gtop-app/functions/index.mjs','gtop-app/scripts/deploy-paper-functions.mjs',
              '.github/workflows/firebase-v2-backend.yml','.github/workflows/firebase-deploy.yml']);
            if(files.includes('gtop-app/functions/index.mjs')&&files.every(file=>notificationPaths.has(file))){
              const read=sha=>execFileSync('git',['show',sha+':gtop-app/functions/index.mjs'],{encoding:'utf8'});
              const old=read(before), current=read(process.env.GITHUB_SHA);
              const legacy=current
                .replace("import {createECDH, randomUUID} from 'node:crypto';","import {randomUUID} from 'node:crypto';")
                .replace(/\/\/ Examination updates use the exact existing Gen 1 create trigger\.[\s\S]*?(?=export const notifyPaperAdmin=)/,'')
                .replace(/const notification=event\.data\?\.data\(\);\n  if\(notification\?\.schema===examPushSchema\)\{[\s\S]*?\n  \}\n  if\(!cleanId/,'const notification=event.data?.data();if(!cleanId');
              if(legacy===old){required=true;backendScope='paper-notify-only';assistantOnly=true;}
            }
            console.log(`Reviewed release: ${files.length} changed paths; backend required: ${required}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `backend_required=${required}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `backend_scope=${backendScope}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `assistant_only=${assistantOnly}\n`);
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE

  reviewed-backend:
    needs: release-scope
    if: needs.release-scope.outputs.backend_required == 'true' && github.ref_name == 'main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.confirm_production))
    uses: ./.github/workflows/firebase-v2-backend.yml
    with:
      deploy_backend: true
      deployment_scope: ${{ needs.release-scope.outputs.backend_scope }}
      allow_planned_rule_change: ${{ needs.release-scope.outputs.backend_scope != 'paper-runtime-only' && needs.release-scope.outputs.backend_scope != 'paper-notify-only' }}
    secrets: inherit

  build-and-verify:
    needs: release-scope
    outputs:
      assistant_only: ${{ needs.release-scope.outputs.assistant_only }}
    if: >-
      !cancelled() && needs.release-scope.result == 'success' &&
      (github.event_name != 'push' || github.event.head_commit != null) &&
      (github.event_name != 'workflow_dispatch' || inputs.target != 'production' || inputs.confirm_production)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gtop-app/package-lock.json
      - name: Install current application
        run: npm ci
        working-directory: gtop-app
      - name: Build current production application
        run: |
          npm run build -- --configuration production
          node -e 'require("fs").writeFileSync("dist/gtop-app/browser/version.json", JSON.stringify({application:"gtop-app",commit:process.env.GITHUB_SHA,branch:process.env.GITHUB_REF_NAME,builtAt:new Date().toISOString()}))'
        working-directory: gtop-app
      - name: Keep the compiled application build for promotion
        if: needs.release-scope.outputs.assistant_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verified-application-${{ github.sha }}
          path: gtop-app/dist/gtop-app/browser
          retention-days: 1
          if-no-files-found: error

  promote-hosting:
    needs: [reviewed-backend, build-and-verify]
    if: >-
      always() && !cancelled() && needs.build-and-verify.result == 'success' &&
      needs.build-and-verify.outputs.assistant_only != 'true' &&
      (needs.reviewed-backend.result == 'success' || needs.reviewed-backend.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.target != 'production' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'firebase-production' || 'firebase-development' }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gtop-app/package-lock.json
      - name: Authenticate read-only development readiness check
        if: needs.reviewed-backend.result == 'skipped'
        id: readiness-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Check shared paper register before development promotion
        if: needs.reviewed-backend.result == 'skipped'
        id: register-ready
        working-directory: gtop-app
        env:
          ACCESS_TOKEN: "${{ steps.readiness-auth.outputs.access_token }}"
        run: node scripts/check-paper-register-ready.mjs
      - uses: actions/download-artifact@v4
        with:
          name: verified-application-${{ github.sha }}
          path: gtop-app/dist/gtop-app/browser
      - name: Deploy current GTOP application
        id: deploy
        if: needs.reviewed-backend.result == 'success' || steps.register-ready.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          entryPoint: gtop-app
          projectId: gtop-app
          channelId: live
          target: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'prod-gtop-app' || github.event_name == 'workflow_dispatch' && 'dev-gtop-app' || github.ref_name == 'main' && 'prod-gtop-app' || 'dev-gtop-app' }}
      - name: Verify actual hosted release and assets
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOY_ORIGIN: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'https://gtop-app.web.app' || github.event_name == 'workflow_dispatch' && 'https://dev-gtop-app.web.app' || github.ref_name == 'main' && 'https://gtop-app.web.app' || 'https://dev-gtop-app.web.app' }}
        run: node scripts/verify-deployment.mjs "$DEPLOY_ORIGIN" "$GITHUB_SHA"
        working-directory: gtop-app
