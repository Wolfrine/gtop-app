<mat-toolbar color="primary" class="header">
    <!-- Back Button (Hidden on Dashboard) -->
    <button *ngIf="showBackButton" mat-icon-button (click)="goBack()">
        <mat-icon>arrow_back_ios_new</mat-icon>
    </button>

    <!-- Hamburger Menu (Only on Dashboard) -->
    <button *ngIf="showHamburgerMenu" mat-icon-button (click)="onMenuClick()">
        <mat-icon>menu</mat-icon>
    </button>

    <!-- Logo -->
    <span class="logo">GTOP</span>

    <!-- Profile Picture with Mat-Menu -->
    <span class="spacer"></span>

    <img [matMenuTriggerFor]="profileMenu" *ngIf="user?.photoURL" [attr.src]="user.photoURL" alt="Profile Picture"
        class="profile-pic" />


    <!-- Profile Menu -->
    <mat-menu #profileMenu="matMenu">
        <button mat-menu-item [routerLink]="'/profile'">
            <mat-icon>person</mat-icon>
            Profile
        </button>
        <button mat-menu-item (click)="signOut()">
            <mat-icon>logout</mat-icon>
            Sign Out
        </button>
    </mat-menu>
</mat-toolbar>
