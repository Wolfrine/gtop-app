<div class="mcq-container">
    <mat-toolbar color="primary">
        <span>Manage MCQs</span>
    </mat-toolbar>

    <div class="mcq-list">
        <mat-accordion>
            <mat-expansion-panel *ngFor="let mcq of mcqs" hideToggle>
                <!-- ✅ HEADER (Collapsible Title & Actions) -->
                <mat-expansion-panel-header>
                    <mat-checkbox [(ngModel)]="mcq.selected"></mat-checkbox>
                    <span class="mcq-title">{{ mcq.title }}</span>
                    <span class="mcq-category">{{ mcq.subject }}</span>
                    <div class="mcq-actions">
                        <button mat-icon-button (click)="editMcq(mcq)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button (click)="deleteMcq(mcq)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </div>
                </mat-expansion-panel-header>

                <!-- ✅ EXPANDED CONTENT -->
                <div class="mcq-details">
                    <p><strong>{{ mcq.question }}</strong></p>
                    <div class="mcq-options">
                        <div *ngFor="let option of mcq.options; let i = index" class="mcq-option">
                            <span class="option-label">{{ optionLabels[i] }}</span> {{ option }}
                        </div>
                    </div>

                    <!-- ✅ Display Correct Answer -->
                    <div class="mcq-solution">
                        <strong>Correct Answer:</strong>
                        <span class="correct-answer">{{ optionLabels[mcq.correctIndex] }} {{
                            mcq.options[mcq.correctIndex] }}</span>
                    </div>
                </div>


            </mat-expansion-panel>
        </mat-accordion>
    </div>
</div>
