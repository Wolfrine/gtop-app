<header class="header" [class.with-navigation]="section" [class.has-context-back]="mobileBack">
    @if (setup) {
        <a routerLink="/" class="back" aria-label="Go back"><mat-icon>arrow_back</mat-icon></a>
    }
    @if (mobileBack; as back) {
        <a class="back context-back" [routerLink]="back.path" [queryParams]="back.queryParams">
            <mat-icon aria-hidden="true">arrow_back</mat-icon>{{ back.label }}
        </a>
    }
    <a [routerLink]="section ? '/dashboard' : '/'" class="brand lumen-home-link">
        <img class="lumen-home-mark" src="assets/brand/growth-logo.webp" alt="" width="42" height="42" decoding="async">GTOP
    </a>
    @if (section) {
        <span class="section">{{ section }}</span>
    }
    @if (user$ | async; as user) {
        <button class="account" type="button" [matMenuTriggerFor]="profileMenu" aria-label="Open profile menu">
            @if (user.photoURL) {
                <img [src]="user.photoURL" alt="">
            } @else {
                <mat-icon aria-hidden="true">account_circle</mat-icon>
            }
            <span>Account</span>
        </button>
        <mat-menu #profileMenu="matMenu">
            <a mat-menu-item routerLink="/profile"><mat-icon>person</mat-icon>Profile &amp; settings</a>
            <button mat-menu-item (click)="signOut()"><mat-icon>logout</mat-icon>Sign out</button>
        </mat-menu>
    }
</header>
