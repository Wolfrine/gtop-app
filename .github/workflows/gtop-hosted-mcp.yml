name: GTOP hosted MCP
on:
  push:
    branches: [codex/gtop-hosted-mcp]
    paths: ['tools/gtop-mcp/**', '.github/workflows/gtop-hosted-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gtop-hosted-mcp-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: firebase-live-backend
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Inspect hosted MCP deployment permissions
        env:
          GOOGLE_ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = 'https://cloudresourcemanager.googleapis.com/v1/projects/gtop-app:testIamPermissions'
          permissions = [
            'run.services.create', 'run.services.update', 'run.services.get',
            'run.services.setIamPolicy', 'cloudbuild.builds.create',
            'serviceusage.services.enable', 'iam.serviceAccounts.create',
            'resourcemanager.projects.setIamPolicy', 'firebaseauth.configs.get',
            'firebaseauth.configs.update', 'artifactregistry.repositories.create'
          ]
          req = urllib.request.Request(base, data=json.dumps({'permissions': permissions}).encode(),
            headers={'Authorization': 'Bearer ' + os.environ['GOOGLE_ACCESS_TOKEN'], 'Content-Type':'application/json'})
          with urllib.request.urlopen(req) as response:
            granted = json.load(response).get('permissions', [])
          print(json.dumps({'granted': granted, 'missing': sorted(set(permissions)-set(granted))}, indent=2))
          PY
      - name: Inspect existing deployment resources
        env:
          GOOGLE_ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ['GOOGLE_ACCESS_TOKEN']
          credentials = json.load(open(os.environ['GOOGLE_APPLICATION_CREDENTIALS']))
          email = credentials.get('client_email')
          print('Deployment identity:', email)
          targets = {
            'services': 'https://run.googleapis.com/v2/projects/gtop-app/locations/-/services',
            'repositories': 'https://artifactregistry.googleapis.com/v1/projects/gtop-app/locations/us-central1/repositories',
            'accounts': 'https://iam.googleapis.com/v1/projects/gtop-app/serviceAccounts',
            'enabled_apis': 'https://serviceusage.googleapis.com/v1/projects/78765581239/services?filter=state:ENABLED&pageSize=200',
            'project': 'https://cloudresourcemanager.googleapis.com/v1/projects/gtop-app',
          }
          for label, url in targets.items():
            req = urllib.request.Request(url, headers={'Authorization': 'Bearer '+token})
            try:
              with urllib.request.urlopen(req) as response: data=json.load(response)
              if label == 'services': data=[{'name':x['name'],'uri':x.get('uri'),'account':x.get('template',{}).get('serviceAccount')} for x in data.get('services',[])]
              if label == 'repositories': data=[{'name':x['name'],'format':x.get('format')} for x in data.get('repositories',[])]
              if label == 'accounts': data=[{'email':x['email'],'disabled':x.get('disabled',False)} for x in data.get('accounts',[])]
              if label == 'enabled_apis': data=[x.get('config',{}).get('name') for x in data.get('services',[])]
              print(label+': '+json.dumps(data))
            except urllib.error.HTTPError as e:
              print(label+': '+str(e.code)+' '+e.read().decode()[:2000])
          PY
      - name: Inspect existing GTOP MCP service and runtime permissions
        env:
          GOOGLE_ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token=os.environ['GOOGLE_ACCESS_TOKEN']
          def call(url, payload=None):
            req=urllib.request.Request(url, data=json.dumps(payload).encode() if payload is not None else None, headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return json.load(r)
            except urllib.error.HTTPError as e: return {'status':e.code,'error':e.read().decode()[:1500]}
          service=call('https://run.googleapis.com/v2/projects/gtop-app/locations/us-central1/services/gtopmcp')
          print('service_metadata: '+json.dumps({k:service.get(k) for k in ['name','uri','labels','creator','lastModifier','createTime','updateTime','buildConfig']}))
          print('service_containers: '+json.dumps([{'image':c.get('image'),'env_keys':[e['name'] for e in c.get('env',[])]} for c in service.get('template',{}).get('containers',[])]))
          for email in ['78765581239-compute@developer.gserviceaccount.com','firebase-adminsdk-fbsvc@gtop-app.iam.gserviceaccount.com']:
            print('act_as '+email+': '+json.dumps(call('https://iam.googleapis.com/v1/projects/gtop-app/serviceAccounts/'+email+':testIamPermissions', {'permissions':['iam.serviceAccounts.actAs']})))
          for path in ['/health','/.well-known/oauth-authorization-server','/.well-known/oauth-protected-resource/mcp']:
            url='https://gtopmcp-7nsfmwaeeq-uc.a.run.app'+path
            try:
              with urllib.request.urlopen(url,timeout=20) as r: print('endpoint '+path+': '+str(r.status)+' '+r.read(3000).decode())
            except Exception as e: print('endpoint '+path+': '+str(e))
          PY
      - name: Inspect deployed Firestore auth-storage isolation
        env:
          GOOGLE_ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          headers={'Authorization':'Bearer '+os.environ['GOOGLE_ACCESS_TOKEN']}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r: return json.load(r)
          release=get('https://firebaserules.googleapis.com/v1/projects/gtop-app/releases/cloud.firestore')
          rules=get('https://firebaserules.googleapis.com/v1/'+release['rulesetName'])
          for source in rules['source']['files']: print('DEPLOYED_RULES '+source['name']+'\n'+source['content'])
          PY
