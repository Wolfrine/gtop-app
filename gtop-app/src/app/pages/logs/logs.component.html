<div class="logs-container">
    <mat-toolbar>
        <h1>Logs</h1>
        <span class="spacer"></span>
        <button mat-button color="warn" (click)="clearLogs()">Clear Logs</button>
    </mat-toolbar>

    <div class="log-entry" *ngFor="let log of logs" [ngClass]="log.level">
        <span class="timestamp">{{ log.timestamp | date:'mediumTime' }}</span>
        <span class="message">{{ log.message }}</span>
    </div>
</div>
