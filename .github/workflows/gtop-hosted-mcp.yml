name: GTOP hosted MCP
on:
  push:
    branches: [main, codex/gtop-hosted-mcp]
    paths: ['tools/gtop-mcp/**', '.github/workflows/gtop-hosted-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gtop-hosted-mcp-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: firebase-live-backend
    timeout-minutes: 20
    env:
      PROJECT: gtop-app
      REGION: us-central1
      SERVICE: gtop-firestore-mcp
      PUBLIC_ORIGIN: https://gtop-firestore-mcp-78765581239.us-central1.run.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/gtop-mcp/package-lock.json
      - name: Build and test authentication and tools
        working-directory: tools/gtop-mcp
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Build service container
        run: docker build -t "us-central1-docker.pkg.dev/$PROJECT/gcf-artifacts/$SERVICE:$GITHUB_SHA" tools/gtop-mcp
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Verify OAuth storage is isolated from Firebase clients
        env:
          ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}'
        run: python3 tools/gtop-mcp/scripts/check-auth-isolation.py
      - uses: google-github-actions/setup-gcloud@v2
      - name: Push versioned service image
        env:
          ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}'
        run: |
          printf '%s' "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin https://us-central1-docker.pkg.dev
          docker push "us-central1-docker.pkg.dev/$PROJECT/gcf-artifacts/$SERVICE:$GITHUB_SHA"
      - name: Deploy authenticated MCP server
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT" --region="$REGION" \
            --image="us-central1-docker.pkg.dev/$PROJECT/gcf-artifacts/$SERVICE:$GITHUB_SHA" \
            --service-account=78765581239-compute@developer.gserviceaccount.com \
            --set-env-vars="GTOP_FIREBASE_PROJECT_ID=$PROJECT,GTOP_MCP_PUBLIC_URL=$PUBLIC_ORIGIN,GTOP_MCP_ADMIN_EMAILS=schttewary@gmail.com" \
            --allow-unauthenticated --ingress=all --port=8080 \
            --memory=512Mi --cpu=1 --min-instances=0 --max-instances=3 \
            --concurrency=40 --timeout=120 --quiet
      - name: Register service origin with Firebase Authentication
        env:
          ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}'
        run: |
          python3 tools/gtop-mcp/scripts/register-domain.py
      - name: Verify public discovery and authentication boundary
        run: |
          python3 tools/gtop-mcp/scripts/verify-deployment.py
