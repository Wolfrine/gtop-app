name: GTOP protected Firebase backend

on:
  workflow_call:
    inputs:
      deploy_backend:
        type: boolean
        default: false
      deployment_scope:
        type: string
        default: firestore-rules-only
      allow_planned_rule_change:
        type: boolean
        default: false
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        required: true
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Deploy the reviewed backend configuration selected below"
        required: true
        default: false
        type: boolean
      deployment_scope:
        description: "Select the reviewed backend scope"
        required: true
        default: firestore-rules-only
        type: choice
        options:
          - firestore-rules-only
          - paper-chat-backend
      allow_planned_rule_change:
        description: "Allow the checked-in Firestore rules to differ from the active release"
        required: true
        default: false
        type: boolean

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: firebase-live-backend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gtop-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        working-directory: gtop-app
        run: npm ci
      - name: Validate browser rules
        working-directory: gtop-app
        run: npm run test:rules && npm run test:database-rules
      - name: Validate paper publication service
        if: inputs.deployment_scope == 'paper-chat-backend'
        working-directory: gtop-app/functions
        run: npm ci && npm test
      - name: Verify paper service integration
        if: inputs.deployment_scope == 'paper-chat-backend'
        working-directory: gtop-app
        run: npx firebase-tools@15 emulators:exec --only firestore,functions --project demo-gtop 'node functions/publication.integration.mjs'
      - name: Authenticate Firebase
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Detect active Firestore rule drift
        shell: bash
        env:
          ACCESS_TOKEN: "${{ steps.auth.outputs.access_token }}"
          ALLOW_CHANGE: "${{ inputs.allow_planned_rule_change }}"
        run: |
          release="$(curl --fail --silent --show-error --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            https://firebaserules.googleapis.com/v1/projects/gtop-app/releases/cloud.firestore)"
          ruleset="$(jq -r .rulesetName <<<"${release}")"
          curl --fail --silent --show-error --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://firebaserules.googleapis.com/v1/${ruleset}" \
            | jq -r '.source.files[] | select(.name == "firestore.rules") | .content' > /tmp/live-firestore.rules
          if ! diff --ignore-all-space --ignore-blank-lines gtop-app/firestore.rules /tmp/live-firestore.rules; then
            echo "Checked-in Firestore rules differ from the active shared production backend."
            test "${ALLOW_CHANGE}" = "true"
          fi
      - name: Deploy protected backend configuration
        if: inputs.deploy_backend
        working-directory: gtop-app
        env:
          DEPLOYMENT_SCOPE: "${{ inputs.deployment_scope }}"
        run: |
          case "$DEPLOYMENT_SCOPE" in
            firestore-rules-only) targets=firestore:rules ;;
            paper-chat-backend) targets=firestore:rules,firestore:indexes,functions:paper-service ;;
            *) echo "Unsupported backend deployment scope"; exit 1 ;;
          esac
          npx firebase-tools@15 deploy --only "$targets" --project gtop-app --non-interactive
      - name: Verify active question-paper permissions after deployment
        if: inputs.deploy_backend
        working-directory: gtop-app
        env:
          ACCESS_TOKEN: "${{ steps.auth.outputs.access_token }}"
        run: node scripts/verify-live-paper-rules.mjs
      - name: Verify deployed paper service
        if: inputs.deploy_backend && inputs.deployment_scope == 'paper-chat-backend'
        working-directory: gtop-app/functions
        run: node verify-deployment.mjs
      - name: Keep active-rule verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification
          path: gtop-app/test-results/active-backend
          retention-days: 7
          if-no-files-found: ignore
